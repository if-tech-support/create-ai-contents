<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP（アニメーション用ライブラリ）。HyperFrames が利用します -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <!--
      動画全体のルート。data-duration は動画の長さ（秒）。
      スライド3枚 × 各10秒 = 合計30秒 です。
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
      style="position:relative;width:1920px;height:1080px;background:#000;"
    >
      <!-- 1枚目のスライド → 0秒から10秒間 表示 -->
      <img
        id="slide1"
        class="clip"
        src="slides/demo.001.png"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;"
      />

      <!-- 2枚目のスライド → 10秒から10秒間 表示 -->
      <img
        id="slide2"
        class="clip"
        src="slides/demo.002.png"
        data-start="10"
        data-duration="10"
        data-track-index="0"
        style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;"
      />

      <!-- 3枚目のスライド → 20秒から10秒間 表示 -->
      <img
        id="slide3"
        class="clip"
        src="slides/demo.003.png"
        data-start="20"
        data-duration="10"
        data-track-index="0"
        style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;"
      />

      <!-- ナレーション音声 → 0秒から動画全体（30秒）に流す -->
      <audio
        id="narration"
        src="audio/narration.wav"
        data-start="0"
        data-duration="30"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>

    <script>
      // HyperFrames が参照するタイムライン。今回はアニメーション無しでOKです。
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
